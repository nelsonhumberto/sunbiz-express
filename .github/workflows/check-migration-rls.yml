name: Check migration RLS

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check-migration-rls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fail if a migration creates a table without RLS
        run: node scripts/check-migration-rls.mjs
