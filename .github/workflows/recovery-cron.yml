name: Recovery cron

on:
  schedule:
    # Minute 37 of every hour. Vercel also calls this route four times a day.
    - cron: "37 * * * *"
  workflow_dispatch:

jobs:
  recovery:
    runs-on: ubuntu-latest
    steps:
      - name: Call the recovery route
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "${CRON_SECRET}" ]; then
            echo "::notice::CRON_SECRET is not set. Skipping the recovery cron."
            exit 0
          fi
          curl -fsS "https://launchforma.com/api/cron/recovery" \
            -H "Authorization: Bearer ${CRON_SECRET}"
